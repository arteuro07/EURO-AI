name: Build llama.cpp for Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android-llama.yml"

permissions:
  contents: read

concurrency:
  group: euro-ai-android-llama
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout llama.cpp source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master
          path: llama.cpp

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android NDK, CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;27.2.12479018"
          test -f "$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"

      - name: Configure Android ARM64 build
        working-directory: llama.cpp
        env:
          ANDROID_NDK_VERSION: 27.2.12479018
        run: |
          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          cmake -S . -B build-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_BLAS=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_CURL=OFF

      - name: Compile llama-server for Android ARM64
        working-directory: llama.cpp
        run: cmake --build build-android --config Release --parallel 2 --target llama-server

      - name: Collect Android runtime files
        working-directory: llama.cpp
        run: |
          mkdir -p runtime
          find build-android -type f \\( -name 'llama-server' -o -name '*.so' \\) -exec cp -t runtime {} +
          test -s runtime/llama-server
          test -s runtime/libllama-server-impl.so
          file runtime/llama-server
          readelf -h runtime/llama-server | grep -q "AArch64"
          echo "Runtime files:"
          ls -lh runtime

      - name: Upload Android ARM64 runtime
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-android-arm64
          path: llama.cpp/runtime/
          if-no-files-found: error
          retention-days: 14
