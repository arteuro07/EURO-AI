name: EURO AI Core Validation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Contrôle à exécuter"
        required: true
        type: choice
        options:
          - validate
          - compile
  push:
    branches: [main]
    paths:
      - "core/**"
      - "config.json"
      - "rules/**"
      - ".github/workflows/ai-engine.yml"

permissions:
  contents: read

concurrency:
  group: euro-ai-core-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate configuration files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in ("config.json", "rules/rules.json", "skills/registry.json"):
              json.loads(Path(path).read_text(encoding="utf-8"))
              print(f"OK: {path}")
          PY
      - name: Compile Python modules
        if: ${{ github.event.inputs.operation == 'compile' || github.event_name == 'push' || github.event.inputs.operation == 'validate' }}
        run: python -m compileall -q core
      - name: Confirm local brain configuration
        run: |
          python - <<'PY'
          import json
          c=json.load(open("config.json", encoding="utf-8"))
          assert c["brain"]["model"] == "Qwen3.5-0.8B"
          assert c["brain"]["quantization"] == "Q4_K_M"
          print("Configuration du cerveau local valide.")
          print("Le modèle s'exécute sur Termux, pas sur le runner GitHub.")
          PY
